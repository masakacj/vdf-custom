name: Validate guarded MainWindow patch runner

on:
  push:
    branches:
      - perf/large-results-interactions-filter-db
    paths:
      - .github/workflows/patch-large-results-mainwindow.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/large-results-interactions-filter-db
      - name: Validate runner
        run: |
          echo "guarded patch runner is active"
          test -f VDF.GUI/ViewModels/MainWindowVM.cs
