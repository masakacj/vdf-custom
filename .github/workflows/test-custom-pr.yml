name: Test VDF Custom PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vdf-custom-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore .\VideoDuplicateFinder.sln

      - name: Run GUI tests
        shell: pwsh
        run: dotnet test .\VDF.GUI.Tests\VDF.GUI.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Build GUI
        shell: pwsh
        run: dotnet build .\VDF.GUI\VDF.GUI.csproj -c Release --no-restore --verbosity minimal
