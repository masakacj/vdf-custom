name: Test VDF Custom PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vdf-custom-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore .\VideoDuplicateFinder.sln

      - name: Run Core tests
        shell: pwsh
        run: dotnet test .\VDF.Core.Tests\VDF.Core.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Run GUI tests
        shell: pwsh
        run: dotnet test .\VDF.GUI.Tests\VDF.GUI.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Build GUI
        shell: pwsh
        run: dotnet build .\VDF.GUI\VDF.GUI.csproj -c Release --no-restore --verbosity minimal

  smoke-native-aot-language:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish GUI win-x64 Native AOT
        shell: pwsh
        run: dotnet publish .\VDF.GUI\VDF.GUI.csproj -c Release -v q -p:PublishAot=true -r win-x64 -o .\artifacts\GUI-aot

      - name: Publish standalone updater win-x64 Native AOT
        shell: pwsh
        run: dotnet publish .\VDF.Updater\VDF.Updater.csproj -c Release -v q -p:PublishAot=true -r win-x64 -o .\artifacts\Updater-aot

      - name: Smoke test standalone updater
        shell: pwsh
        run: .\artifacts\Updater-aot\VDF.Updater.exe --help --no-pause

      - name: Smoke test English/Chinese normal and software-rendered startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\\artifacts\\GUI-aot\\VDF.GUI.exe').Path
          $trace = Join-Path (Split-Path $exe) 'startup-trace.txt'

          function Assert-GuiOpensWindow([string]$language, [string]$suffix, [bool]$software) {
            $settings = Join-Path $env:RUNNER_TEMP "vdf-startup-$suffix.json"
            $json = @{ LanguageCode = $language; WelcomeStripDismissed = $true } | ConvertTo-Json -Compress
            [IO.File]::WriteAllText($settings, $json, [Text.UTF8Encoding]::new($false))
            Remove-Item -LiteralPath $trace -ErrorAction SilentlyContinue
            $argsForGui = @('--settings', ('"' + $settings + '"'))
            if ($software) { $argsForGui += '--software-rendering' }
            Write-Host "Launching $language software=$software with settings $settings"
            $p = Start-Process -FilePath $exe -ArgumentList $argsForGui -PassThru
            try {
              $opened = $false
              for ($attempt = 0; $attempt -lt 20; $attempt++) {
                Start-Sleep -Seconds 1
                $p.Refresh()
                if ($p.HasExited) {
                  throw "GUI exited before opening a window ($language software=$software). ExitCode=$($p.ExitCode)"
                }
                if ((Test-Path -LiteralPath $trace) -and
                    ((Get-Content -LiteralPath $trace -Raw) -match 'MainWindow Opened')) {
                  $opened = $true
                  break
                }
              }
              if (-not $opened) {
                $tail = if (Test-Path $trace) { Get-Content $trace -Tail 20 | Out-String } else { 'no startup trace' }
                throw "GUI did not open its main window ($language software=$software). $tail"
              }
              if ($software -and -not ((Get-Content $trace -Raw) -match 'Rendering backend selected: software')) {
                throw 'Software rendering override was ignored.'
              }
            }
            finally {
              $p.Refresh()
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
              Wait-Process -Id $p.Id -ErrorAction SilentlyContinue
            }
          }

          Assert-GuiOpensWindow 'en' 'en' $false
          Assert-GuiOpensWindow 'zh-Hans' 'zh-Hans' $false
          Assert-GuiOpensWindow 'en' 'en-software' $true

      - name: Upload PR GUI AOT for real-device graphics verification
        uses: actions/upload-artifact@v4
        with:
          name: vdf-pr-gui-aot
          path: artifacts/GUI-aot/**
          if-no-files-found: error
          retention-days: 3
