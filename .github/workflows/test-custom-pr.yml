name: Test VDF Custom PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vdf-custom-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-gui:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore .\VideoDuplicateFinder.sln

      - name: Run GUI tests
        shell: pwsh
        run: dotnet test .\VDF.GUI.Tests\VDF.GUI.Tests.csproj -c Release --no-restore --verbosity normal

      - name: Build GUI
        shell: pwsh
        run: dotnet build .\VDF.GUI\VDF.GUI.csproj -c Release --no-restore --verbosity minimal

  smoke-native-aot-language:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish GUI win-x64 Native AOT
        shell: pwsh
        run: dotnet publish .\VDF.GUI\VDF.GUI.csproj -c Release -v q -p:PublishAot=true -r win-x64 -o .\artifacts\GUI-aot

      - name: Smoke test English and Simplified Chinese startup
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\artifacts\GUI-aot\VDF.GUI.exe').Path

          function Assert-GuiStaysAlive([string]$language, [string]$suffix) {
            $settings = Join-Path $env:RUNNER_TEMP "vdf-startup-$suffix.json"
            $json = @{ LanguageCode = $language; WelcomeStripDismissed = $true } | ConvertTo-Json -Compress
            [IO.File]::WriteAllText($settings, $json, [Text.UTF8Encoding]::new($false))

            Write-Host "Launching $language with settings $settings"
            $p = Start-Process -FilePath $exe -ArgumentList @('--settings', ('"' + $settings + '"')) -PassThru
            Start-Sleep -Seconds 8
            $p.Refresh()
            if ($p.HasExited) {
              throw "GUI exited during $language startup smoke test. ExitCode=$($p.ExitCode)"
            }

            Stop-Process -Id $p.Id -Force
            Wait-Process -Id $p.Id -ErrorAction SilentlyContinue
          }

          Assert-GuiStaysAlive 'en' 'en'
          Assert-GuiStaysAlive 'zh-Hans' 'zh-Hans'
