name: Fix folder results worker syntax

on:
  push:
    branches:
      - perf/folder-results-switch-expand

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/folder-results-switch-expand
      - name: Fix guarded syntax
        shell: pwsh
        run: |
          $path = 'VDF.GUI/ViewModels/MainWindowVM_ResourceResultsPerformance.cs'
          $text = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
          $old = "`t`t`t_ = Task.Run(() => {`n`t`t`t`ttry {`n`t`t`t`t{`n"
          $new = "`t`t`t_ = Task.Run(() => {`n`t`t`t`ttry {`n"
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) { throw "Expected one nested try block, found $count" }
          [IO.File]::WriteAllText($path, $text.Replace($old, $new), [Text.UTF8Encoding]::new($false))
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VDF.GUI/ViewModels/MainWindowVM_ResourceResultsPerformance.cs
          git commit -m 'Fix folder results background worker block'
          git push origin HEAD:perf/folder-results-switch-expand
