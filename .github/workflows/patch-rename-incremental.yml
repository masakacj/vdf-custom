name: Patch rename incremental refresh

on:
  push:
    branches:
      - perf/large-results-interactions-filter-db
    paths:
      - .github/workflows/patch-rename-incremental.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/large-results-interactions-filter-db
          fetch-depth: 0
      - name: Guarded rename patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('VDF.GUI/ViewModels/MainWindowVM.cs')
          s = p.read_text(encoding='utf-8')
          old = '''\t\t\ttry {\n\t\t\t\tstring oldPath = currentItem.ItemInfo.Path;\n\t\t\t\tScanEngine.GetFromDatabase(oldPath, out var dbEntry);\n\t\t\t\tfi.MoveTo(newName, true);\n\t\t\t\tScanEngine.UpdateFilePathInDatabase(newName, dbEntry!);\n\t\t\t\tcurrentItem.ItemInfo.Path = newName;\n\t\t\t\tif (!ScanEngine.PersistInteractiveDatabaseMove(oldPath, newName, out string journalError)) {\n\t\t\t\t\tLogger.Instance.Warn($"Interactive rename journal failed; falling back to a full database checkpoint: {journalError}");\n\t\t\t\t\tScanEngine.SaveDatabase();\n\t\t\t\t}\n\t\t\t}\n'''
          new = '''\t\t\ttry {\n\t\t\t\tstring oldPath = currentItem.ItemInfo.Path;\n\t\t\t\tbool hasDatabaseEntry = ScanEngine.GetFromDatabase(oldPath, out var dbEntry);\n\t\t\t\tfi.MoveTo(newName, true);\n\t\t\t\tif (hasDatabaseEntry && dbEntry != null) {\n\t\t\t\t\tScanEngine.UpdateFilePathInDatabase(newName, dbEntry);\n\t\t\t\t\tif (!ScanEngine.PersistInteractiveDatabaseMove(oldPath, newName, out string journalError)) {\n\t\t\t\t\t\tLogger.Instance.Warn($"Interactive rename journal failed; falling back to a full database checkpoint: {journalError}");\n\t\t\t\t\t\tScanEngine.SaveDatabase();\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\tcurrentItem.ItemInfo.Path = newName;\n\t\t\t\tMarkResultItemMutation(currentItem.ItemInfo.GroupId);\n\t\t\t\tRefreshResultsView();\n\t\t\t}\n'''
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'expected exactly one rename block, found {n}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "vdf-performance-bot"
          git config user.email "vdf-performance-bot@users.noreply.github.com"
          git add VDF.GUI/ViewModels/MainWindowVM.cs
          git diff --cached --check
          git commit -m "Refresh renamed result groups incrementally"
          git push origin HEAD:perf/large-results-interactions-filter-db
