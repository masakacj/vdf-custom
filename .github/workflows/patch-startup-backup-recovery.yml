name: Patch startup backup recovery

on:
  push:
    branches:
      - perf/large-results-interactions-filter-db
    paths:
      - .github/workflows/patch-startup-backup-recovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/large-results-interactions-filter-db
          fetch-depth: 0
      - name: Apply guarded startup recovery patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('VDF.GUI/ViewModels/MainWindowVM.cs')
          s = p.read_text(encoding='utf-8')
          replacements = [
              (
                  'startup restore opts into DB reconciliation',
                  '''\t\tpublic async Task RestoreBackupScanResultsAsync() {\n\t\t\tif (File.Exists(BackupScanResultsFile))\n\t\t\t\tawait ImportScanResultsIncludingThumbnails(BackupScanResultsFile);\n\t\t}\n''',
                  '''\t\tpublic async Task RestoreBackupScanResultsAsync() {\n\t\t\tif (File.Exists(BackupScanResultsFile))\n\t\t\t\tawait ImportScanResultsIncludingThumbnails(BackupScanResultsFile, reconcileWithLoadedDatabase: true);\n\t\t}\n'''
              ),
              (
                  'import gains startup-only reconciliation flag',
                  '''\t\tasync Task ImportScanResultsIncludingThumbnails(string? path = null) {\n''',
                  '''\t\tasync Task ImportScanResultsIncludingThumbnails(string? path = null, bool reconcileWithLoadedDatabase = false) {\n'''
              ),
              (
                  'reconcile stale automatic backup before blacklist/view build',
                  '''\t\t\t\tif (items.Count == 0)\n\t\t\t\t\tthrow new JsonException("All scan result entries were corrupt");\n\n\t\t\t\t// Apply not-a-match blacklist; saved results may pre-date marks made just before a crash.\n''',
                  '''\t\t\t\tif (items.Count == 0)\n\t\t\t\t\tthrow new JsonException("All scan result entries were corrupt");\n\n\t\t\t\tif (reconcileWithLoadedDatabase) {\n\t\t\t\t\t// The DB has already loaded and the interactive mutation journal has already\n\t\t\t\t\t// replayed. Treat that durable state as truth: a coalesced automatic backup can\n\t\t\t\t\t// legitimately lag a delete/rename by a fraction of a second if the process dies.\n\t\t\t\t\tint reconciled = await Task.Run(() => ReconcileStartupBackupItems(\n\t\t\t\t\t\titems,\n\t\t\t\t\t\tScanEngine.GetLoadedDatabasePathsSnapshot(),\n\t\t\t\t\t\tScanEngine.GetPendingInteractiveDatabaseMovesSnapshot()));\n\t\t\t\t\tif (reconciled > 0)\n\t\t\t\t\t\tLogger.Instance.Info($"Removed {reconciled:N0} stale startup-backup result item(s) after database/journal reconciliation.");\n\t\t\t\t}\n\n\t\t\t\t// Apply not-a-match blacklist; saved results may pre-date marks made just before a crash.\n'''
              ),
          ]
          for label, old, new in replacements:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              s = s.replace(old, new, 1)
              print('patched', label)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "vdf-recovery-bot"
          git config user.email "vdf-recovery-bot@users.noreply.github.com"
          git add VDF.GUI/ViewModels/MainWindowVM.cs
          git diff --cached --check
          git commit -m "Reconcile stale automatic backup on startup"
          git push origin HEAD:perf/large-results-interactions-filter-db
