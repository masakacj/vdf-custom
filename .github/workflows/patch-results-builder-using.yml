name: Fix ResultsListBuilder threading using

on:
  push:
    branches:
      - perf/large-results-interactions-filter-db
    paths:
      - .github/workflows/patch-results-builder-using.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/large-results-interactions-filter-db
          fetch-depth: 0
      - name: Add missing using
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('VDF.GUI/ViewModels/Results/ResultsListBuilder.cs')
          s = p.read_text(encoding='utf-8')
          old = 'using System.Linq;\nusing VDF.Core.Utils;\n'
          new = 'using System.Linq;\nusing System.Threading;\nusing VDF.Core.Utils;\n'
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'expected one using block, found {n}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "vdf-performance-bot"
          git config user.email "vdf-performance-bot@users.noreply.github.com"
          git add VDF.GUI/ViewModels/Results/ResultsListBuilder.cs
          git diff --cached --check
          git commit -m "Fix result builder cancellation import"
          git push origin HEAD:perf/large-results-interactions-filter-db
