name: Patch explicit exit save

on:
  push:
    branches:
      - perf/large-results-interactions-filter-db
    paths:
      - .github/workflows/patch-explicit-save.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/large-results-interactions-filter-db
          fetch-depth: 0
      - name: Guarded replacement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('VDF.GUI/ViewModels/MainWindowVM.cs')
          s = p.read_text(encoding='utf-8')
          old = '''\t\t\tif (result != MessageBoxButtons.Yes) {\n\t\t\t\treturn true;\n\t\t\t}\n\t\t\tawait ExportScanResults(BackupScanResultsFile);\n\t\t\treturn true;\n'''
          new = '''\t\t\tif (result != MessageBoxButtons.Yes) {\n\t\t\t\treturn true;\n\t\t\t}\n\t\t\t// Explicit exit/update save keeps the original synchronous path: show the\n\t\t\t// saving overlay, report errors to the user, and do not exit before the file\n\t\t\t// replacement completes. Automatic list-change backups use the one-string\n\t\t\t// overload and remain coalesced/background.\n\t\t\tawait ExportScanResults(BackupScanResultsFile, includeThumbnails: true);\n\t\t\treturn true;\n'''
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'expected exactly one SaveScanResults block, found {n}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "vdf-performance-bot"
          git config user.email "vdf-performance-bot@users.noreply.github.com"
          git add VDF.GUI/ViewModels/MainWindowVM.cs
          git diff --cached --check
          git commit -m "Keep explicit exit result save synchronous"
          git push origin HEAD:perf/large-results-interactions-filter-db
