name: Patch keyboard triage group lookup

on:
  push:
    branches:
      - perf/large-results-interactions-filter-db
    paths:
      - .github/workflows/patch-keyboard-triage-group.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: perf/large-results-interactions-filter-db
          fetch-depth: 0
      - name: Guarded replacement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('VDF.GUI/ViewModels/MainWindowVM.cs')
          s = p.read_text(encoding='utf-8')
          old = '''\t\tpublic ReactiveCommand<Unit, Unit> KeepHighlightedAndAdvanceCommand => ReactiveCommand.Create(() => {\n\t\t\tif (GetSelectedDuplicateItem() is DuplicateItemVM keeper) {\n\t\t\t\tusing var _ = BeginSelectionUndoBatch();\n\t\t\t\tkeeper.Checked = false;\n\t\t\t\tforeach (var item in Duplicates)\n\t\t\t\t\tif (item.ItemInfo.GroupId == keeper.ItemInfo.GroupId && !ReferenceEquals(item, keeper))\n\t\t\t\t\t\titem.Checked = true;\n\t\t\t}\n\t\t\tNavigateGroup(forward: true);\n\t\t});\n'''
          new = '''\t\tpublic ReactiveCommand<Unit, Unit> KeepHighlightedAndAdvanceCommand => ReactiveCommand.Create(() => {\n\t\t\tif (GetSelectedDuplicateItem() is DuplicateItemVM keeper) {\n\t\t\t\tusing var _ = BeginSelectionUndoBatch();\n\t\t\t\tkeeper.Checked = false;\n\n\t\t\t\tGuid groupId = keeper.ItemInfo.GroupId;\n\t\t\t\tint groupIndex = FindResultsGroupIndex(groupId);\n\t\t\t\tResultsGroupHeader? visibleGroup = groupIndex >= 0 && groupIndex < resultsGroups.Count\n\t\t\t\t\t? resultsGroups[groupIndex]\n\t\t\t\t\t: null;\n\t\t\t\tIEnumerable<DuplicateItemVM> members;\n\t\t\t\tif (visibleGroup != null && visibleGroup.Rows.Count == GetFastGroupItemCount(groupId)) {\n\t\t\t\t\t// Normal unfiltered keyboard triage: the visible canonical group is complete,\n\t\t\t\t\t// so touch only its handful of rows instead of scanning every result.\n\t\t\t\t\tmembers = visibleGroup.Rows.Select(row => row.Item);\n\t\t\t\t}\n\t\t\t\telse {\n\t\t\t\t\t// A filter may hide members. Preserve the old all-group semantics in that\n\t\t\t\t\t// uncommon case by falling back to the complete duplicate collection.\n\t\t\t\t\tmembers = Duplicates.Where(item => item.ItemInfo.GroupId == groupId);\n\t\t\t\t}\n\t\t\t\tforeach (DuplicateItemVM item in members)\n\t\t\t\t\tif (!ReferenceEquals(item, keeper))\n\t\t\t\t\t\titem.Checked = true;\n\t\t\t}\n\t\t\tNavigateGroup(forward: true);\n\t\t});\n'''
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'expected exactly one keyboard triage block, found {n}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "vdf-performance-bot"
          git config user.email "vdf-performance-bot@users.noreply.github.com"
          git add VDF.GUI/ViewModels/MainWindowVM.cs
          git diff --cached --check
          git commit -m "Avoid full result scan during keyboard triage"
          git push origin HEAD:perf/large-results-interactions-filter-db
